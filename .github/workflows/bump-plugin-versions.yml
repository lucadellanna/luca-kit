name: bump-plugin-versions

on:
  push:
    branches: [main]
    # The bump commit only touches plugin.json files, so paths-ignore
    # prevents the workflow from re-triggering on its own commit.
    paths-ignore:
      - 'plugins/*/.claude-plugin/plugin.json'

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump changed plugin versions
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          python3 << 'EOF'
          import glob, json, os, subprocess, sys

          def run(cmd):
              return subprocess.check_output(cmd, text=True).strip()

          def ls_tree(ref, path):
              """Return the set of immediate children of path at ref. Empty set if path didn't exist."""
              try:
                  out = run(['git', 'ls-tree', '--name-only', ref, path])
                  return set(out.splitlines()) if out else set()
              except subprocess.CalledProcessError:
                  return set()

          before = os.environ['BEFORE']
          after  = os.environ['AFTER']

          # before is all zeros on the very first push to a branch
          if set(before) == {'0'}:
              sys.exit(0)

          try:
              changed = run(['git', 'diff', f'{before}..{after}', '--name-only']).splitlines()
          except subprocess.CalledProcessError:
              sys.exit(0)

          bumped = []

          for plugin_json_path in glob.glob('plugins/*/.claude-plugin/plugin.json'):
              plugin_dir = os.path.dirname(os.path.dirname(plugin_json_path))
              prefix = plugin_dir + '/'

              content_changes = [
                  f for f in changed
                  if f.startswith(prefix) and f != plugin_json_path
              ]
              if not content_changes:
                  continue

              # Detect structural changes: skill dirs, command files, hook scripts
              structural = (
                  ls_tree(before, prefix + 'skills/') != ls_tree(after, prefix + 'skills/') or
                  ls_tree(before, prefix + 'commands/') != ls_tree(after, prefix + 'commands/') or
                  {f for f in ls_tree(before, prefix + 'hooks/') if f.endswith('.sh')} !=
                  {f for f in ls_tree(after, prefix + 'hooks/') if f.endswith('.sh')}
              )

              with open(plugin_json_path) as f:
                  data = json.load(f)

              parts = data['version'].split('.')
              if structural:
                  parts[1] = str(int(parts[1]) + 1)
                  parts[2] = '0'
              else:
                  parts[2] = str(int(parts[2]) + 1)
              data['version'] = '.'.join(parts)

              tmp = plugin_json_path + '.tmp'
              with open(tmp, 'w') as f:
                  json.dump(data, f, indent=2)
                  f.write('\n')
              os.replace(tmp, plugin_json_path)

              subprocess.run(['git', 'add', plugin_json_path], check=True)
              bumped.append(f"{data['name']} -> {data['version']}")

          if bumped:
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write('BUMPED=' + '; '.join(bumped) + '\n')
          else:
              print('No plugin content changes.')
          EOF

      - name: Commit and push
        if: env.BUMPED != ''
        env:
          BUMPED: ${{ env.BUMPED }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: bump plugin versions ($BUMPED)"
          git push
